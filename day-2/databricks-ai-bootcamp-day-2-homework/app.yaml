command:
  - "python"
  - "app.py"

env:
  # app uses this auth to access to lakebase
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # National Weather Service (no API key required)
  - name: WEATHER_API_BASE_URL
    value: "https://api.weather.gov"
  - name: WEATHER_USER_AGENT
    value: "databricks-ai-bootcamp-day-2-homework (contact: you@example.com)"
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL;Austin, TX;Miami, FL"
  - name: WEATHER_DOCUMENTS_TABLE
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE
    value: "weather_embeddings"
  - name: WEATHER_EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: WEATHER_RAG_ENDPOINT
    value: "databricks-claude-sonnet-4-5"
